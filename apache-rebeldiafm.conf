# Apache/cPanel Reverse Proxy Configuration for Rebeldia FM
# Add this to WHM -> Service Configuration -> Apache Configuration -> Include Editor
# Or create in /etc/apache2/conf.d/userdata/ssl/2_4/rebeldiafm/rebeldiafm.conf
# Then run: /scripts/rebuildhttpdconf && systemctl reload httpd

<IfModule mod_proxy.c>
    <IfModule mod_proxy_http.c>
        <IfModule mod_proxy_wstunnel.c>
            # WebSocket support
            ProxyPass /socket.io/ ws://127.0.0.1:3000/socket.io/
            ProxyPassReverse /socket.io/ ws://127.0.0.1:3000/socket.io/
        </IfModule>

        # Main proxy to Node.js app
        ProxyPass / http://127.0.0.1:3000/
        ProxyPassReverse / http://127.0.0.1:3000/

        # Preserve headers
        ProxyPreserveHost On
        RequestHeader set X-Forwarded-Proto "https"
        RequestHeader set X-Forwarded-Port "443"
        RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"

        # Timeouts
        ProxyTimeout 300
        ProxyBadHeader Ignore

        # Connection pooling
        <Proxy http://127.0.0.1:3000>
            ProxySet connectiontimeout=5 timeout=300 keepalive=On
        </Proxy>
    </IfModule>
</IfModule>

# Security headers
<IfModule mod_headers.c>
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; frame-ancestors 'self';"
    
    # HSTS (uncomment if SSL is properly configured)
    # Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
</IfModule>

# Gzip compression
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/plain text/html text/xml text/css text/javascript application/javascript application/json application/xml
    DeflateCompressionLevel 6
</IfModule>

# Cache static assets
<IfModule mod_expires.c>
    ExpiresActive On
    ExpiresByType image/svg+xml "access plus 1 year"
    ExpiresByType image/webp "access plus 1 year"
    ExpiresByType image/png "access plus 1 year"
    ExpiresByType image/jpg "access plus 1 year"
    ExpiresByType image/jpeg "access plus 1 year"
    ExpiresByType text/css "access plus 1 year"
    ExpiresByType application/javascript "access plus 1 year"
    ExpiresByType application/json "access plus 1 year"
    ExpiresByType font/woff "access plus 1 year"
    ExpiresByType font/woff2 "access plus 1 year"
</IfModule>

# Deny access to sensitive files
<FilesMatch "^\.(env|git|htaccess|htpasswd)$">
    Require all denied
</FilesMatch>

<FilesMatch "\.(env|log|sql|dump)$">
    Require all denied
</FilesMatch>